# Roda os testes que não precisam do PJe-Calc a cada envio de código e em cada pull request.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64
      - name: Testes unitários
        run: python -I tests/test_unidades.py
      - name: Assistente Claude (MCP), pelas pontes Python e Node
        run: python -I tests/mcp_fluxo.py
      - name: Atualização automática
        run: python -I tests/atualizacao_fluxo.py
      - name: Pacote do instalador (monta, confere o Python embutido e mostra o tamanho de cada parte)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $p = & .\tools\empacotar.ps1 -Python $env:pythonLocation -SemZip | Select-Object -Last 1
          $p = (Get-Item $p).FullName
          $partes = Get-ChildItem $p, "$p\python", "$p\python\Lib", "$p\python\DLLs" | ForEach-Object {
            $b = if ($_.PSIsContainer) { (Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum } else { $_.Length }
            [pscustomobject]@{ MB = [math]::Round($b / 1MB, 1); Item = $_.FullName.Substring($p.Length + 1) }
          } | Sort-Object MB -Descending | Select-Object -First 15
          $total = (Get-ChildItem $p -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          "::notice title=Pacote::{0:N1} MB no total; maiores: {1}" -f $total, (($partes | ForEach-Object { "$($_.Item) $($_.MB) MB" }) -join "; ")
          if ($total -gt 45) { throw ("Pacote com {0:N1} MB: algo grande entrou no instalador." -f $total) }
