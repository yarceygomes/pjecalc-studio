<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PJe-Calc Studio</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%234aa3ff'/%3E%3Cstop offset='1' stop-color='%230a6cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7.5' fill='url(%23g)'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='-apple-system,Segoe UI,sans-serif' font-size='12' font-weight='700' fill='white'%3EPJ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<header class="topo" role="banner">
  <a class="marca" href="#/" aria-label="PJe-Calc Studio — painel de cálculos">
    <span class="marca-icone" aria-hidden="true">PJ</span><span>PJe-Calc <strong>Studio</strong></span>
  </a>
  <button class="busca-global" id="abrirPaleta" type="button" aria-haspopup="dialog" aria-keyshortcuts="Control+K" aria-label="Pesquisar funções e campos (Ctrl+K)">
    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
    <span class="rotulo-busca">Pesquisar</span> <kbd>Ctrl</kbd><kbd>K</kbd>
  </button>
  <div class="topo-acoes">
    <span id="statusMotor" class="pill pill-neutro" role="status" aria-live="polite">Verificando PJe-Calc…</span>
    <a id="statusAtualizacao" class="pill pill-ok" href="#/config" hidden></a>
    <div class="grupo-botoes" role="group" aria-label="Modo de uso: Guiado mostra só o essencial; Avançado mostra todos os campos">
      <button type="button" id="modoGuiado" aria-pressed="true" title="Mostra só os campos essenciais">Guiado</button>
      <button type="button" id="modoAvancado" aria-pressed="false" title="Mostra todos os campos e colunas">Avançado</button>
    </div>
    <button type="button" id="fonteMenos" class="botao-icone" aria-label="Diminuir texto" title="Diminuir texto">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18 8.5 7 13 18M5.7 14.5h5.6"/><path d="M16 12h5"/></svg></button>
    <button type="button" id="fonteMais" class="botao-icone" aria-label="Aumentar texto" title="Aumentar texto">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19 8 6l5 13M4.9 15h6.2"/><path d="M16 12h6M19 9v6"/></svg></button>
    <button type="button" id="tema" class="botao-icone" aria-label="Alternar tema claro ou escuro" title="Tema claro ou escuro">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
    <a href="#/config" class="botao-icone" aria-label="Configurações e diagnóstico" title="Configurações">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/><circle cx="12" cy="12" r="6.6"/></svg></a>
  </div>
</header>
<div class="corpo">
  <nav id="lateral" class="lateral" aria-label="Navegação"></nav>
  <main id="conteudo" tabindex="-1"></main>
  <aside id="painelAjuda" class="painel-ajuda" aria-label="Ajuda do campo" hidden></aside>
</div>
<div id="barraAcoes" class="barra-acoes" hidden></div>
<div id="avisos" class="avisos" role="status" aria-live="polite" aria-atomic="false"></div>
<dialog id="dialogo" aria-modal="true"></dialog>
<dialog id="paleta" class="paleta" aria-label="Pesquisar funções e campos"></dialog>
<script src="ajuda.js"></script>
<script src="ajuda-pjecalc.js"></script>
<script src="planilha.js"></script>
<script src="app.js"></script>
</body>
</html>
